<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">

<head>
  <title>Ceiling Fan Control</title>
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
 
<style>
  body {
    background-color: rgb(8, 41, 69);
    color: darkblue;
    font-family: "Roboto", monospace;
    height: 90vh;
  }

  #svg2 {
    display: none;
  }

  .container {
    background-color: rgb(206, 229, 249);
    max-width: 60% !important;
    margin: 2rem auto;
    padding: 0 2rem;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    border: 3px solid crimson;
    border-radius: 8px;
    box-shadow: 2px 2px 5px 2px rgba(0, 0, 0, 0.2);
  }

  .title {
    margin-top: 2rem;
  }
  i {
    margin: 0 .66rem;
    transform: scale(1.4);
  }
  footer {
    display: flex;
    justify-content: center;
    align-items: center;
    height: 8vh;
    width: 100%;
    background-color: rgb(206, 229, 249);
    position: fixed;
    bottom: 0;
    left: 0;
  }
</style>

  <script th:inline="javascript">
    let isFirstSvg = true;

    function toggleSvg() {
      const svg1 = document.getElementById("svg1");
      const svg2 = document.getElementById("svg2");

      if (isFirstSvg) {
        svg1.style.display = "none";
        svg2.style.display = "block";
      } else {
        svg1.style.display = "block";
        svg2.style.display = "none";
      }

      isFirstSvg = !isFirstSvg;
    }

    document.addEventListener("keypress", function (e) {
      if (e.key === "s" || e.key === "S") {
        $.get("/api/pull-speed-cord", function (data) {
          $("#fanSpeedStatus").html(data);
          console.log(data);
        });
      } else if (e.key === "d" || e.key === "D") {
        $.get("/api/pull-direction-cord", function (data) {
          $("#fanDirectionStatus").html(data);
          console.log(data);
          toggleSvg();
        });
      } else if (e.key === "r" || e.key === "R") {
        window.location.href = "/recipe";
      }
    });
  </script>

</head>

<body>
  <div class="container">
    <h1 class="title">Ceiling Fan Control</h1>
    <div
      style="background-color: aliceblue; border-radius: 8px; padding: 1rem; margin: 1rem; box-shadow: black 1px 1px 4px 2px;">

        stroke-width="0.0005" transform="matrix(1, 0, 0, 1, 0, 0)rotate(0)">
        <g id="SVGRepo_bgCarrier" stroke-width="0"></g>
        <g id="SVGRepo_tracerCarrier" stroke-linecap="round" stroke-linejoin="round" stroke="#CCCCCC"
          stroke-width="0.1"></g>
        <g id="SVGRepo_iconCarrier">
          <path

          stroke-width="0.4"></g>

          </path>
        </g>
      </svg>
    </div>
    <div style="display: flex;">
      <h3>
        Press 's' to pull the speed cord and 'd' to pull the direction cord.
      </h3>
    </div>
    <div style="font-weight: bold; margin-bottom: 1rem; color: crimson; font-style: italic;">
      <div id="fanSpeedStatus" style="margin: .5rem 0;">
        <!--/*@thymesVar id="fanSpeedStatus" type="templates"*/-->
        <p th:text="${fanSpeedStatus != null ? fanSpeedStatus : 'Fan speed will appear here.'}"></p>
      </div>
      <div id="fanDirectionStatus" style="margin: 1rem 0;">
        <!--/*@thymesVar id="fanDirectionStatus" type="templates"*/-->
        <p th:text="${fanDirectionStatus != null ? fanDirectionStatus : 'Fan direction will appear here.'}"></p>
      </div>
    </div>
  </div>
  <footer>
    <p style="padding-right: 1rem;">© 2024 CookingMeister</p>
    <a href="https://github.com/CookingMeister" target="_blank" rel="noopener noreferrer">
      <i class="fab fa-github-square"></i>
    </a>
    <a href="https://www.linkedin.com/in/shawn-meister/" target="_blank" rel="noopener noreferrer">
      <i class="fab fa-linkedin"></i>
  </footer>
</body>

</html>
