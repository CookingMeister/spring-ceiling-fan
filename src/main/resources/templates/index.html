<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
  <head>
    <title>Ceiling Fan Control</title>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <script th:inline="javascript">
      let isFirstSvg = true;

      function toggleSvg() {
        const svg1 = document.getElementById("svg1");
        const svg2 = document.getElementById("svg2");

        if (isFirstSvg) {
          svg1.style.display = "none";
          svg2.style.display = "block";
        } else {
          svg1.style.display = "block";
          svg2.style.display = "none";
        }

        isFirstSvg = !isFirstSvg;
      }

      document.addEventListener("keypress", function (e) {
        if (e.key === "s" || e.key === "S") {
          fetch("/api/pull-speed-cord", { method: "GET" })
            .then((response) => response.text())
            .then((result) => console.log(result));
        } else if (e.key === "d" || e.key === "D") {
          $.get("/api/pull-direction-cord", function (data) {
            $("#fanStatus").html(data);
            console.log(data);
            toggleSvg();
          });
        } else if (e.key === "r" || e.key === "R") {
          window.location.href = "/recipe";
        }
      });
    </script>
    <style>
      body {
        background-color: rgb(206, 229, 249);
        color: brown;
        font-family: "Courier New", Courier, monospace;
        height: 80vh;
      }
      #svg2 {
        display: none;
      }
    </style>
  </head>
  <body>
    <div
      style="
        background-color: aliceblue;
        margin: 4rem;    
        padding: 0 2rem;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        border: 2px solid brown;
        border-radius: 8px;
        box-shadow: 2px 2px 5px 2px rgba(0, 0, 0, 0.2);
        
      "
    >

          stroke-linecap="round"

          ></path>
        </g>
      </svg>
      <div style="display: flex">
        <h3>
          Press 's' to pull the speed cord and 'd' to pull the direction cord.
        </h3>
      </div>
      <div id="fanStatus" style="font-weight: bold;
      margin-bottom: 1rem;">
        <!-- fan status -->
        <p
          th:text="${fanStatus != null ? fanStatus : 'Fan status will appear here.'}"
        ></p>
      </div>
    </div>
    <footer
      style="
        display: flex;
        justify-content: center;
        align-items: center;
        height: 8vh;
        width: 100%;
        background-color: rgb(68, 62, 185);
        color: antiquewhite;
        position: fixed;
        bottom: 0;
        left: 0;
      "
    >
      © 2024 CookingMeister
    </footer>
  </body>
</html>
